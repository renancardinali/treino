<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino 2">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Treino · Renan · Ciclo 2</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2330; --line:#2a3240;
    --txt:#e6edf3; --muted:#8b97a7; --accent:#3b82f6; --accent2:#22c55e;
    --deload:#f59e0b; --danger:#ef4444;
    --biA:#3b82f6; --biB:#a855f7; --biC:#14b8a6; --biD:#f97316; --biE:#ec4899; --biF:#84cc16;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:130px;
    -webkit-user-select:none; user-select:none;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(13,17,23,.92);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
  }
  .h-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .h-title h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  .h-sub{font-size:11px;color:var(--muted)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto; padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600;
    background:var(--card); border:1px solid var(--line); color:var(--muted); white-space:nowrap;
  }
  .tab.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .weekbar{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
  .weekbar::-webkit-scrollbar{display:none}
  .wk{
    flex:0 0 auto; width:40px; text-align:center; padding:6px 0; border-radius:10px;
    font-size:12px; font-weight:700; background:var(--card); border:1px solid var(--line); color:var(--muted);
    position:relative;
  }
  .wk small{display:block;font-size:9px;font-weight:600;color:var(--muted);opacity:.8}
  .wk.active{background:var(--txt);color:#0d1117;border-color:var(--txt)}
  .wk.deload{border-color:var(--deload)}
  .wk.deload.active{background:var(--deload);color:#1a1204;border-color:var(--deload)}
  .wk.deload:not(.active){color:var(--deload)}

  main{padding:12px 12px 0}
  .dayhead{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
  .dayhead .name{font-size:20px;font-weight:800}
  .deload-note{
    background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); color:var(--deload);
    font-size:12px; padding:8px 12px; border-radius:10px; margin-bottom:12px; font-weight:600;
  }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px; margin-bottom:10px; position:relative;
  }
  .card.biset{border-left-width:4px}
  .card.biset[data-bi="A"]{border-left-color:var(--biA)}
  .card.biset[data-bi="B"]{border-left-color:var(--biB)}
  .card.biset[data-bi="C"]{border-left-color:var(--biC)}
  .card.biset[data-bi="D"]{border-left-color:var(--biD)}
  .card.biset[data-bi="E"]{border-left-color:var(--biE)}
  .card.biset[data-bi="F"]{border-left-color:var(--biF)}
  .card.biset.cont{margin-top:-6px;border-top-left-radius:0;border-top-right-radius:0}
  .biset-tag{
    display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;
    color:#0d1117;margin-bottom:6px;
  }
  .biset-tag.A{background:var(--biA)} .biset-tag.B{background:var(--biB)} .biset-tag.C{background:var(--biC)}
  .biset-tag.D{background:var(--biD)} .biset-tag.E{background:var(--biE)} .biset-tag.F{background:var(--biF)}
  .ex-name{font-size:15px;font-weight:700;line-height:1.25;padding-right:36px}
  .ex-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--card2);color:var(--muted)}
  .chip.sets{color:var(--txt)}
  .chip.muscle{color:#93c5fd;background:rgba(59,130,246,.12)}
  .lastweek{
    display:flex;align-items:center;gap:8px;margin-top:10px;
    background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.28);border-radius:10px;
    padding:7px 10px;font-size:12px;color:#bbf7d0;font-weight:600;
  }
  .lastweek .tagw{font-size:10px;font-weight:800;color:#0d1117;background:var(--accent2);border-radius:6px;padding:2px 6px;white-space:nowrap}
  .lastweek .vals b{color:#eafff1;font-weight:800}
  .lastweek.empty{background:var(--card2);border-color:var(--line);color:var(--muted)}
  .lastweek.empty .tagw{background:var(--muted)}
  .inputs{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px;align-items:end}
  .field label{display:block;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .field input{
    width:100%; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--txt); font-size:18px; font-weight:700; padding:10px; text-align:center; outline:none;
    -webkit-user-select:text; user-select:text;
  }
  .field input:focus{border-color:var(--accent)}
  .field input.filled{border-color:var(--accent2)}
  .prev{font-size:10px;color:var(--muted);margin-top:3px;text-align:center;height:12px}
  .rest-btn{
    height:44px;min-width:52px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    color:var(--txt);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  }
  .rest-btn:active{background:var(--accent);border-color:var(--accent)}
  .rest-btn .t{font-size:14px}
  .rest-btn .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .rest-btn:active .l{color:#dbeafe}
  .biset-link{font-size:11px;color:var(--muted);margin-top:10px;font-weight:600}
  .biset-link b{color:var(--txt)}

  /* Timer floating bar */
  #timer{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:linear-gradient(180deg,rgba(22,27,34,.4),var(--card) 30%);
    border-top:1px solid var(--line);
    padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
    transform:translateY(100%); transition:transform .25s ease;
  }
  #timer.show{transform:translateY(0)}
  #timer.done{animation:flash .5s ease 3}
  @keyframes flash{50%{background:var(--accent2)}}
  .t-row{display:flex;align-items:center;gap:12px}
  .t-time{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:120px;letter-spacing:1px}
  .t-time.low{color:var(--danger)}
  .t-bar{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
  .t-fill{height:100%;background:var(--accent);width:100%;transition:width .3s linear}
  .t-fill.low{background:var(--danger)}
  .t-ctrls{display:flex;gap:8px;margin-top:10px}
  .t-ctrls button{
    flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
    color:var(--txt);font-size:15px;font-weight:700;
  }
  .t-ctrls button:active{transform:scale(.97)}
  .t-ctrls .primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .t-ctrls .close{flex:0 0 46px}
  .t-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}

  .quickbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:8px;justify-content:center;
    padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
    background:linear-gradient(180deg,transparent,var(--bg) 40%);}
  .quickbar button{
    background:var(--card);border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:14px;
    padding:12px 16px;border-radius:12px;flex:1;max-width:120px;
  }
  .quickbar button:active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* Done check + resumo */
  .h-actions{display:flex;align-items:center;gap:10px}
  .resumo-btn{background:var(--card);border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:12px;padding:7px 11px;border-radius:9px}
  .resumo-btn:active{background:var(--accent);border-color:var(--accent);color:#fff}
  .donebtn{border:1.5px solid var(--accent2);background:transparent;color:var(--accent2);font-weight:800;font-size:13px;padding:10px 14px;border-radius:11px;white-space:nowrap}
  .donebtn.done{background:var(--accent2);color:#062a12;border-color:var(--accent2)}
  .donebtn:active{transform:scale(.97)}
  .tab .tk{color:var(--accent2);font-weight:900}
  .tab.active .tk{color:#eafff1}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;border:1px solid var(--line);
    padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:85vh;overflow:auto}
  .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:16px;font-weight:800}
  .sheethead button{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;border-radius:9px;font-size:15px}
  .scards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .scard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .scard .n{font-size:26px;font-weight:800;color:var(--accent2)}
  .scard .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}
  .sbreak{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:6px 2px 12px}
  .srow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;margin-bottom:11px;font-size:13px}
  .srow.dl span{color:var(--deload)}
  .srow b{color:var(--txt);font-variant-numeric:tabular-nums}
  .sbar{grid-column:1/3;height:6px;background:var(--card2);border-radius:99px;overflow:hidden}
  .sbar i{display:block;height:100%;background:var(--accent2)}

  /* per-exercise check */
  .excheck{position:absolute;top:11px;right:11px;width:30px;height:30px;border-radius:50%;
    border:2px solid var(--line);background:var(--card2);color:var(--accent2);font-weight:900;font-size:15px;
    display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
  .excheck.on{background:var(--accent2);border-color:var(--accent2);color:#062a12}
  .excheck:active{transform:scale(.9)}
  .card.exdone{opacity:.62}
  .card.exdone .ex-name{text-decoration:line-through;text-decoration-color:var(--muted)}

  /* session chrono */
  .sessbtn{
    border:1.5px solid var(--accent);background:transparent;color:var(--accent);
    font-weight:800;font-size:13px;padding:10px 12px;border-radius:11px;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .sessbtn.run{background:var(--accent);color:#fff}
  .sessbtn.run .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:5px;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .sessbtn:active{transform:scale(.97)}
  .dayhead .btns{display:flex;gap:8px;align-items:center}

  /* week progress */
  .wk{overflow:hidden}
  .wk .fillbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
  .wk .fillbar i{display:block;height:100%;background:var(--accent2);border-radius:99px}
  .wk.full{border-color:var(--accent2)}
  .wk.full:not(.active){color:var(--accent2)}
  .wk.full.active{background:var(--accent2);color:#062a12;border-color:var(--accent2)}
  .wk small.ok{color:var(--accent2);opacity:1;font-weight:900}
  .wk.active small.ok{color:#062a12}
  .wk.full.active .fillbar i{background:#062a12}

  /* backup */
  .sbreak2{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:20px 2px 10px}
  .backup{display:flex;gap:8px}
  .backup button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:13px;padding:12px;border-radius:11px}
  .backup button:active{background:var(--accent);border-color:var(--accent);color:#fff}
  .backup-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.45}
  .backup-note b{color:var(--txt)}

  /* --- ciclo 2: referência de carga, notas, tags e barra de corrida --- */
  .ref{display:flex;align-items:center;gap:8px;margin-top:9px;
    background:rgba(139,151,167,.10);border:1px solid var(--line);border-radius:10px;
    padding:7px 10px;font-size:12px;color:var(--muted);font-weight:600}
  .ref .tagr{font-size:9px;font-weight:800;color:#0d1117;background:var(--muted);
    border-radius:6px;padding:2px 6px;white-space:nowrap;letter-spacing:.3px}
  .ref span.v{color:var(--txt);font-weight:800}
  .note{margin-top:9px;font-size:12px;line-height:1.5;color:var(--muted);
    border-left:2px solid var(--line);padding-left:10px}
  .tagex{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;
    margin-bottom:6px;margin-right:6px;color:#0d1117;letter-spacing:.3px}
  .tagex.REAB{background:var(--accent2)}
  .tagex.CUIDADO{background:var(--deload)}
  .card.reab{border-left:4px solid var(--accent2)}
  .card.cuidado{border-left:4px solid var(--deload)}
  .runbar{display:flex;align-items:flex-start;gap:9px;
    background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.30);
    border-radius:12px;padding:10px 12px;margin-bottom:12px;
    font-size:12.5px;color:#bfdbfe;font-weight:600;line-height:1.45}
  .runbar .ico{font-size:15px;line-height:1.2}
  .runbar.key{background:rgba(249,115,22,.13);border-color:rgba(249,115,22,.45);color:#fed7aa}
  .tagex.VAR{background:var(--biB)}
  .card.pendente{opacity:.45}
  .card.pendente .inputs{display:none}
  .pendnote{margin-top:9px;font-size:12px;line-height:1.5;color:var(--deload);font-weight:700;
    border-left:2px solid var(--deload);padding-left:10px}
</style>
</head>
<body>
<header>
  <div class="h-title">
    <h1 id="appTitle">Plano de Treino</h1>
    <div class="h-actions">
      <button class="resumo-btn" onclick="openSummary()">📊 Resumo</button>
      <span class="h-sub" id="saved">salvo ✓</span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="weekbar" id="weekbar"></div>
</header>

<main>
  <div class="dayhead"><div class="name" id="dayName"></div><div class="btns"><button id="sessBtn" class="sessbtn" onclick="sessTap()">▶ Iniciar</button><button id="doneBtn" class="donebtn" onclick="toggleDone()">Concluir treino do dia</button></div></div>
  <div id="runBar" class="runbar" style="display:none"></div>
  <div id="deloadNote" class="deload-note" style="display:none">Semana de DELOAD — corte ~25% da carga e some uma repetição de reserva. Os exercícios marcados REAB continuam iguais: tendão gosta de constância, não de pausa.</div>
  <div id="list"></div>
</main>

<div class="quickbar" id="quickbar">
  <button onclick="startTimer(60,'Descanso 60s')">60s</button>
  <button onclick="startTimer(90,'Descanso 90s')">90s</button>
  <button onclick="startTimer(120,'Descanso 120s')">120s</button>
</div>

<div id="summary" class="modal" onclick="if(event.target===this)closeSummary()">
  <div class="sheet">
    <div class="sheethead"><span>📊 Resumo de treinos</span><button onclick="closeSummary()">✕</button></div>
    <div id="summaryBody"></div>
  </div>
</div>

<div id="timer">
  <div class="t-label" id="tLabel">Descanso</div>
  <div class="t-row">
    <div class="t-time" id="tTime">01:00</div>
    <div class="t-bar"><div class="t-fill" id="tFill"></div></div>
  </div>
  <div class="t-ctrls">
    <button onclick="adjust(-15)">−15s</button>
    <button class="primary" id="tPause" onclick="togglePause()">Pausar</button>
    <button onclick="adjust(15)">+15s</button>
    <button class="close" onclick="stopTimer()">✕</button>
  </div>
</div>

<script>
const DATA = {"store": "treino_renan_v2", "appTitle": "Treino · Renan · Hipertrofia", "weeks": 14, "deload": [5, 10, 14], "days": [{"title": "Dia 1 · Lower A — Quadríceps & Glúteo", "short": "LOWER A", "run": "Sem corrida. OPCIONAL: 25 min de caminhada em PLANO depois do treino — caminhada, nunca esteira inclinada, bike ou escada. Essas três agridem exatamente os tendões do laudo.", "exercises": [{"name": "0. ABRE COM REAB · isometria de adução + ponte de perna longa", "sets": "4 x 30-45s + 4 x 30s/lado", "rest": "40s", "restSec": 40, "muscle": "Adutor/posterior proximal", "biset": null, "tag": "REAB", "note": "Oito minutos antes de tudo. Com só uma dose semanal (quarta), adutor e isquiotibial estavam sub-tratados — protocolo de tendinopatia pede 2 a 3 vezes por semana. Aqui serve de ativação e de tratamento ao mesmo tempo."}, {"name": "1. Leg press, pés na largura do quadril, parar em ~90°", "sets": "4 x 8-10", "rest": "90s", "restSec": 90, "muscle": "Quadríceps", "biset": null, "ref": "120 kg × 10 (S7)", "tag": "CUIDADO", "note": "Duas regras que não mudam: não descer além de 90° de quadril (flexão profunda estica o isquiotibial na inserção) e pés paralelos, nunca abertos (abertura puxa o adutor na sínfise). Dentro disso, pode carregar."}, {"name": "2. Cadeira extensora", "sets": "4 x 12-15", "rest": "60s", "restSec": 60, "muscle": "Quadríceps", "biset": null, "ref": "60 kg × 15 (S8)", "note": "Com agachamento e hack fora, extensora e leg press carregam o quadríceps sozinhas. Última série até falhar de verdade.", "alt": {"from": 8, "name": "2. Cadeira extensora UNILATERAL com pausa de 1s no topo", "sets": "4 x 12-15/lado", "note": "Variação B. Unilateral corrige assimetria e a pausa no topo aumenta o tempo sob tensão sem precisar de mais carga."}}, {"name": "3. Leg press UNILATERAL, pé centralizado na plataforma", "sets": "3 x 10-12/lado", "rest": "75s", "restSec": 75, "muscle": "Quadríceps/glúteo", "biset": null, "note": "Exercício novo. Unilateral dá mais estímulo sem flexão profunda de quadril. Pé no centro, nunca aberto — é isso que mantém o adutor fora da jogada. Comece com ~40% da carga bilateral.", "alt": {"from": 8, "name": "3. Leg press UNILATERAL com pausa de 2s embaixo", "note": "Variação B. Aqui a mudança é de execução, não de exercício: sem agachamento, hack ou afundo, o repertório de quadríceps é curto — então varia-se o tempo, não o aparelho."}}, {"name": "4. Elevação pélvica / hip thrust (almofada no quadril)", "sets": "4 x 10-12", "rest": "90s", "restSec": 90, "muscle": "Glúteo", "biset": null, "ref": "40 kg × 12 (S8)", "note": "Bem tolerado mesmo com a entesopatia: o posterior trabalha encurtado. Este pode e deve progredir carga toda semana.", "alt": {"from": 8, "name": "4. Elevação pélvica com pausa de 2s no topo", "note": "Variação B. Última série termina com isometria de 20s no topo."}}, {"name": "A1. Cadeira abdutora ou caminhada lateral c/ mini band", "sets": "3 x 15-20", "rest": "—", "restSec": 0, "muscle": "Glúteo médio", "biset": "A"}, {"name": "A2. Glúteo no cabo (kickback)", "sets": "3 x 15/lado", "rest": "60s", "restSec": 60, "muscle": "Glúteo", "biset": "A", "ref": "9 kg × 12 (S4)", "alt": {"from": 8, "name": "A2. Extensão de quadril na MÁQUINA (glute machine)", "note": "Variação B do kickback no cabo."}}, {"name": "5. Panturrilha em pé na MÁQUINA", "sets": "4 x 12-15", "rest": "45s", "restSec": 45, "muscle": "Panturrilha", "biset": null, "ref": "131 kg × 15 (S5)", "note": "Pausa de 1s embaixo e 1s em cima. Panturrilha só cresce com amplitude completa e sem embalo.", "alt": {"from": 8, "name": "5. Panturrilha no LEG PRESS", "sets": "4 x 12-15", "note": "Variação B. Mesmo músculo, ângulo de joelho diferente do gêmeo em pé."}}]}, {"title": "Dia 2 · Push — Peito & Ombro", "short": "PUSH", "run": "Corrida FÁCIL depois da musculação · 6 km, uns 40-45 min. Fácil = você consegue falar uma frase inteira sem ofegar. Se não consegue, está rápido demais: diminua. Pode caminhar 1 min a cada 5 se precisar.", "exercises": [{"name": "1. Supino reto com HALTERES", "sets": "4 x 8-10", "rest": "90s", "restSec": 90, "muscle": "Peito", "biset": null, "ref": "30 kg × 10 (S8)", "tag": "CUIDADO", "note": "Você disse \"sem doer muito\", não \"sem dor\". Até 3/10 durante, e a manhã seguinte não pode piorar. Se piorar, troque pelo supino na máquina convergente (35 kg) — trocar não é retrocesso."}, {"name": "2. Supino INCLINADO com HALTERES", "sets": "4 x 10-12", "rest": "75s", "restSec": 75, "muscle": "Peito superior", "biset": null, "ref": "17,5 kg × 12 (S5)", "note": "Ganhou uma série. Peito superior é metade do formato em V que você quer — a outra metade é dorsal, na quinta.", "alt": {"from": 8, "name": "2. Supino INCLINADO na MÁQUINA", "note": "Variação B. Caminho fixo permite carregar mais sem exigir estabilização — e poupa o cotovelo."}}, {"name": "3. Crucifixo na MÁQUINA / peck deck", "sets": "3 x 12-15", "rest": "60s", "restSec": 60, "muscle": "Peito", "biset": null, "ref": "45 kg × 12 (S2)", "note": "Alongamento máximo na volta, 2 segundos. É onde o peito mais responde.", "alt": {"from": 8, "name": "3. Crossover na POLIA alta, cruzando à frente", "note": "Variação B. Tensão constante do início ao fim, coisa que o peck deck não dá."}}, {"name": "B1. Desenvolvimento na MÁQUINA (neutro)", "sets": "4 x 10-12", "rest": "—", "restSec": 0, "muscle": "Ombro", "biset": "B", "ref": "27 kg × 12 (S2)"}, {"name": "B2. Elevação lateral (máquina ou halteres)", "sets": "4 x 12-15", "rest": "75s", "restSec": 75, "muscle": "Deltoide medial", "biset": "B", "ref": "6 kg × 12 (S2)", "note": "11 séries de deltoide lateral por semana somando com a sexta. É o músculo que mais muda a silhueta por série investida.", "alt": {"from": 8, "name": "B2. Elevação lateral UNILATERAL na polia baixa", "note": "Variação B. Tensão na parte baixa do movimento, onde o halter não carrega nada."}}, {"name": "4. Tríceps na POLIA com corda", "sets": "4 x 12-15", "rest": "60s", "restSec": 60, "muscle": "Tríceps", "biset": null, "ref": "27 kg × 12 (S2)", "tag": "CUIDADO", "note": "Ganhou uma série. Entesopatia tricipital no laudo: não trave o cotovelo no fim do movimento e pare na primeira fisgada. Cotovelos colados no tronco — o que protege é a amplitude, não o número de séries.", "alt": {"from": 8, "name": "4. Tríceps na POLIA com barra reta, pegada pronada", "note": "Variação B. Mesmas regras: cotovelo nunca trava, cotovelos colados no tronco."}}, {"name": "5. REAB COTOVELO · extensão de punho excêntrica + isometria", "sets": "3 x 15 (3s) + 5 x 30s", "rest": "45s", "restSec": 45, "muscle": "Extensores do punho", "biset": null, "tag": "REAB", "note": "Halter de 1-2 kg, antebraço apoiado. Sobe com a esquerda, desce em 3s só com a direita. Depois segure parado, 5 × 30s. Isto é tratamento, não aquecimento."}]}, {"title": "Dia 3 · Lower B — Posterior, Adutor & Core", "short": "LOWER B", "run": "Sem corrida e sem aeróbico. Hoje é o dia dos tendões em tratamento — não vale a pena somar carga neles depois de já tê-los carregado.", "exercises": [{"name": "1. Isometria de adução (bola/almofada entre os joelhos, 45°)", "sets": "5 x 30-45s", "rest": "45s", "restSec": 45, "muscle": "Adutores", "biset": null, "tag": "REAB", "note": "Dor durante ≤3/10 e sem piora no dia seguinte. É este exercício que trata a inserção na sínfise — entra até na semana de deload."}, {"name": "2. Cadeira adutora (MÁQUINA)", "sets": "4 x 12-15", "rest": "60s", "restSec": 60, "muscle": "Adutores", "biset": null, "tag": "REAB", "note": "Você já está respondendo a este — então não segure a carga. Suba um pino sempre que fechar as 15 repetições sem dor e sem piora na manhã seguinte. 3 segundos na fase de abertura."}, {"name": "3. Mesa flexora DEITADA (máquina)", "sets": "4 x 10-12", "rest": "75s", "restSec": 75, "muscle": "Posteriores", "biset": null, "ref": "50 kg × 12 (S8)", "note": "3s na descida. Deitada, nunca sentada — a sentada comprime o túber isquiático, que é onde está a entesopatia."}, {"name": "4. Ponte isométrica de perna longa (calcanhar no banco)", "sets": "4 x 30s/lado", "rest": "45s", "restSec": 45, "muscle": "Posterior proximal", "biset": null, "tag": "REAB", "note": "Joelho quase estendido, quadril alto, glúteo apertado. É a carga que faz o isquiotibial proximal cicatrizar."}, {"name": "5. Stiff com HALTERES — amplitude CURTA", "sets": "3 x 10-12", "rest": "90s", "restSec": 90, "muscle": "Posterior/glúteo", "biset": null, "ref": "10 kg × 18 (S8)", "tag": "CUIDADO", "note": "Descer só até o meio da coxa: amplitude completa estica exatamente a inserção lesionada no túber isquiático. O app só libera este exercício a partir da semana 5.", "from": 5}, {"name": "A1. Panturrilha em pé (máquina ou halteres)", "sets": "4 x 12-15", "rest": "—", "restSec": 0, "muscle": "Panturrilha", "biset": "A", "ref": "10 kg × 20 (S2)", "alt": {"from": 8, "name": "A1. Panturrilha em pé com HALTERES", "note": "Variação B."}}, {"name": "A2. Sóleo sentado (panturrilha sentada)", "sets": "3 x 15-20", "rest": "60s", "restSec": 60, "muscle": "Sóleo", "biset": "A", "note": "Exercício novo. Gêmeo e sóleo respondem a estímulos diferentes — sem o sentado você treina só metade da panturrilha."}, {"name": "6. Core · abdominal na polia + Pallof press", "sets": "4 x 12-15 / 3 x 12 por lado", "rest": "45s", "restSec": 45, "muscle": "Core", "biset": null, "note": "Abdominal na polia engrossa o reto abdominal; Pallof controla a pelve. Mas seja franco consigo: o abdômen que aparece vem do déficit calórico, não destas séries.", "alt": {"from": 8, "name": "6. Core · abdominal na MÁQUINA + prancha com peso", "note": "Variação B. A máquina permite progredir carga, o que o abdominal na polia já não estava permitindo."}}]}, {"title": "Dia 4 · Pull — Costas & Deltoide posterior", "short": "PULL", "run": "Corrida FÁCIL depois da musculação · 5 km, uns 35 min. Mesmo ritmo de terça — devagar. Se as pernas estiverem pesadas, corte esta e não o longão de sábado.", "exercises": [{"name": "1. Puxada alta pegada ABERTA (pronada)", "sets": "4 x 10-12", "rest": "90s", "restSec": 90, "muscle": "Dorsais", "biset": null, "note": "Exercício novo e o mais importante do dia para o formato em V: pegada aberta recruta a parte alta e lateral do dorsal. Use straps sempre."}, {"name": "2. Puxada alta pegada NEUTRA (triângulo) c/ straps", "sets": "3 x 10-12", "rest": "75s", "restSec": 75, "muscle": "Dorsais", "biset": null, "ref": "11 × 12 (S5)", "note": "Straps em todas as séries. Eles tiram a demanda de preensão do epicôndilo medial, onde está a lesão de 50% da espessura.", "alt": {"from": 8, "name": "2. Remada baixa (cavalinho) pegada NEUTRA", "note": "Variação B da puxada neutra. Straps sempre — pegada neutra e apoiada protege o epicôndilo medial."}}, {"name": "A1. Remada na MÁQUINA pegada neutra", "sets": "4 x 10-12", "rest": "—", "restSec": 0, "muscle": "Costas", "biset": "A", "ref": "55 kg × 12 (S8)"}, {"name": "A2. Remada unilateral com HALTER c/ straps", "sets": "3 x 10-12/lado", "rest": "75s", "restSec": 75, "muscle": "Costas", "biset": "A", "ref": "20 kg × 12 (S8)", "alt": {"from": 8, "name": "A2. Remada na POLIA baixa unilateral, pegada neutra", "note": "Variação B. Menos exigência de preensão que o halter, mesma amplitude."}}, {"name": "3. Pullover na POLIA com corda", "sets": "3 x 12-15", "rest": "60s", "restSec": 60, "muscle": "Dorsais", "biset": null, "ref": "36 kg × 12 (S5)", "note": "Braços quase retos, só o ombro trabalha. É o isolador do dorsal — sem cotovelo envolvido, o que aqui é uma vantagem.", "alt": {"from": 8, "name": "3. Pulldown com BRAÇOS RETOS na barra", "note": "Variação B do pullover. Isola o dorsal sem envolver o cotovelo — vantagem no seu caso."}}, {"name": "B1. Crucifixo invertido na MÁQUINA (peck deck invertido)", "sets": "4 x 15", "rest": "—", "restSec": 0, "muscle": "Deltoide posterior", "biset": "B", "ref": "6 kg (halteres) × 15 (S5)", "note": "Trocado dos halteres para a máquina: pegada apoiada, sem esforço de preensão."}, {"name": "B2. Rosca no banco SCOTT ou máquina", "sets": "3 x 12-15", "rest": "75s", "restSec": 75, "muscle": "Bíceps", "biset": "B", "note": "Veio da sexta para cá. Bíceps depois de costas é o pareamento natural, e tira 3 séries de cotovelo da sexta — que estava com 14 séries diretas de braço numa sessão só, demais para um cotovelo com sinovite.", "alt": {"from": 8, "name": "B2. Rosca concentrada sentado, pegada neutra", "note": "Variação B do Scott. Braço apoiado na coxa, sem supinação forçada."}}, {"name": "5. REAB COTOVELO · flexão de punho excêntrica + isometria", "sets": "3 x 15 (3s) + 5 x 30s", "rest": "45s", "restSec": 45, "muscle": "Flexores do punho", "biset": null, "tag": "REAB", "note": "Mesmo protocolo de terça, palma para cima — trata o lado de dentro do cotovelo, onde está a lesão maior."}]}, {"title": "Dia 5 · Braço & Ombro", "short": "BRAÇO", "run": "25 min de caminhada plana depois do treino, se quiser. Amanhã, sábado: LONGÃO de 9-10 km, uns 60-70 min — mesmo ritmo fácil de sempre, só mais longo. Não é teste, não é para acelerar no fim.", "runKey": true, "exercises": [{"name": "1. Elevação lateral com HALTERES", "sets": "4 x 12-15", "rest": "60s", "restSec": 60, "muscle": "Deltoide medial", "biset": null, "ref": "7 kg × 12 (S7)", "note": "Abre o treino com ela, descansado. Carga leve, execução limpa, sem embalo de tronco — deltoide lateral responde a repetição controlada, não a peso.", "alt": {"from": 8, "name": "1. Elevação lateral na MÁQUINA", "note": "Variação B. Caminho fixo, dá para ir mais perto da falha com segurança."}}, {"name": "A1. Desenvolvimento na MÁQUINA, pegada neutra", "sets": "3 x 10-12", "rest": "—", "restSec": 0, "muscle": "Ombro", "biset": "A", "ref": "32 kg × 12 (S8)"}, {"name": "A2. Remada alta na POLIA c/ corda, cotovelos baixos", "sets": "3 x 12-15", "rest": "75s", "restSec": 75, "muscle": "Deltoide/trapézio", "biset": "A", "ref": "32 kg × 15 (S1)", "alt": {"from": 8, "name": "A2. Face pull na POLIA alta com corda", "note": "Variação B da remada alta. Mais deltoide posterior, menos trapézio."}}, {"name": "B1. Rosca martelo com HALTERES", "sets": "4 x 10-12", "rest": "—", "restSec": 0, "muscle": "Bíceps", "biset": "B", "ref": "10 kg × 10 (S5)", "note": "Único exercício de bíceps da sexta — a rosca no Scott passou para a quinta. Pegada neutra com punho parado é das variações menos agressivas ao epicôndilo. Se a manhã seguinte piorar, troque por máquina."}, {"name": "C. Tríceps na POLIA com barra V", "sets": "4 x 10-12", "rest": "75s", "restSec": 75, "muscle": "Tríceps", "biset": null, "ref": "32 kg × 12 (S1)", "tag": "CUIDADO", "note": "Carga um pouco maior que a da terça, repetições um pouco menores. Cotovelo nunca trava no fim — pare 10° antes da extensão completa, que é onde a inserção do tríceps recebe o pico de tensão.", "alt": {"from": 8, "name": "C. Tríceps na POLIA unilateral, pegada neutra", "note": "Variação B. Unilateral corrige assimetria — e o lado direito é o lesionado."}}, {"name": "D. Tríceps na MÁQUINA (ou unilateral na polia, pegada neutra)", "sets": "3 x 12-15", "rest": "60s", "restSec": 60, "muscle": "Tríceps", "biset": null, "note": "Exercício novo — é ele que leva o tríceps de 7 para 11 séries semanais. Caminho fixo e apoiado, carga moderada, sem buscar falha. Se a máquina não existir, unilateral na polia com pegada neutra resolve.", "alt": {"from": 8, "name": "D. Tríceps na POLIA com corda, tronco levemente inclinado", "note": "Variação B. O tronco à frente alonga um pouco a cabeça longa, sem ir para overhead."}}, {"name": "3. REAB COTOVELO · só isometria (extensores e flexores)", "sets": "5 x 30s cada", "rest": "30s", "restSec": 30, "muscle": "Cotovelo", "biset": null, "tag": "REAB", "note": "Hoje sem excêntrico: o cotovelo já trabalhou terça, quinta e agora fez 7 séries de tríceps. A isometria alivia a dor sem somar carga."}]}]};
const STORE = DATA.store || 'treino_renan_v1';
if(DATA.appTitle){ document.getElementById('appTitle').textContent=DATA.appTitle; document.title=DATA.appTitle; }
let state = load();
let day = state.day ?? 0;
let week = state.week ?? 1;

function load(){ try{return JSON.parse(localStorage.getItem(STORE))||{}}catch(e){return {}} }
function save(){ state.day=day; state.week=week; localStorage.setItem(STORE, JSON.stringify(state)); flashSaved(); }
let savedT;
function flashSaved(){ const el=document.getElementById('saved'); el.style.opacity=1; clearTimeout(savedT); savedT=setTimeout(()=>el.style.opacity=.35,900); }

function cell(d,w,i){ return (((state.data||{})[d]||{})[w]||{})[i] || {}; }
function lastFilled(d,w,i,floor){
  for(let x=w-1;x>=(floor||1);x--){ const c=cell(d,x,i); if(c.carga||c.reps) return {w:x,carga:c.carga,reps:c.reps}; }
  return null;
}
function isDone(d,w){ return !!(((state.done||{})[d]||{})[w]); }
function getDur(d,w){ return (((state.dur||{})[d]||{})[w]) || 0; }
function toggleDone(){
  state.done=state.done||{}; state.done[day]=state.done[day]||{};
  if(state.done[day][week]){
    delete state.done[day][week];
    if(state.dur&&state.dur[day]) delete state.dur[day][week];
  } else {
    state.done[day][week]=Date.now();
    if(state.sess){
      const secs=Math.round((Date.now()-state.sess.start)/1000);
      state.dur=state.dur||{}; state.dur[day]=state.dur[day]||{};
      state.dur[day][week]=secs;
      state.sess=null;
      if(navigator.vibrate)navigator.vibrate([60,40,60]);
    }
  }
  save(); renderTabs(); renderWeeks(); renderDoneBtn(); renderSess();
}

/* ---------- Session chronometer ---------- */
let sessTick=null;
function fmtDur(s){
  if(!s)return '0min';
  const h=Math.floor(s/3600), m=Math.round((s%3600)/60);
  if(h>0) return h+'h'+String(m).padStart(2,'0');
  return m+'min';
}
function fmtClock(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  return (h>0? h+':'+String(m).padStart(2,'0') : m)+':'+String(ss).padStart(2,'0');
}
function sessTap(){
  if(state.sess){
    if(confirm('Cancelar o cronômetro? O tempo desta sessão será descartado. (Para registrar, use "Concluir treino do dia".)')){
      state.sess=null; save(); renderSess();
    }
  } else {
    state.sess={start:Date.now(), day:day, week:week};
    save(); renderSess();
    if(navigator.vibrate)navigator.vibrate(20);
  }
}
function renderSess(){
  const b=document.getElementById('sessBtn'); if(!b)return;
  clearInterval(sessTick); sessTick=null;
  if(state.sess){
    const upd=()=>{ b.innerHTML='<span class="dot"></span>'+fmtClock(Math.round((Date.now()-state.sess.start)/1000)); };
    b.className='sessbtn run'; upd();
    sessTick=setInterval(()=>{ if(state.sess)upd(); else {clearInterval(sessTick);renderSess();} },1000);
  } else {
    const d=getDur(day,week);
    b.className='sessbtn';
    b.textContent = (isDone(day,week)&&d) ? '⏱ '+fmtDur(d) : '▶ Iniciar';
  }
}
function isExDone(d,w,i){ return !!((((state.exdone||{})[d]||{})[w]||{})[i]); }
function toggleEx(i){
  state.exdone=state.exdone||{}; state.exdone[day]=state.exdone[day]||{}; state.exdone[day][week]=state.exdone[day][week]||{};
  if(state.exdone[day][week][i]) delete state.exdone[day][week][i];
  else state.exdone[day][week][i]=Date.now();
  save();
  const on=isExDone(day,week,i);
  const btn=document.querySelector('.excheck[data-i="'+i+'"]');
  if(btn){ btn.classList.toggle('on',on); btn.innerHTML=on?'✓':''; const card=btn.closest('.card'); if(card)card.classList.toggle('exdone',on); }
}
function fmtDate(ms){ return new Date(ms).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
function renderDoneBtn(){
  const b=document.getElementById('doneBtn'); if(!b)return;
  const done=isDone(day,week);
  b.className='donebtn'+(done?' done':'');
  b.textContent=done ? '✓ Treino feito '+fmtDate(state.done[day][week]) : 'Concluir treino do dia';
}
function openSummary(){
  const done=state.done||{}, nd=DATA.days.length;
  const now=Date.now(), wk7=now-7*864e5;
  const D=new Date(), m0=new Date(D.getFullYear(),D.getMonth(),1).getTime();
  let total=0,last7=0,month=0; const perWeek={}, timeWeek={};
  let timeTotal=0, timeCount=0;
  Object.keys(done).forEach(d=>Object.keys(done[d]).forEach(w=>{
    const ts=done[d][w]; total++; if(ts>=wk7)last7++; if(ts>=m0)month++;
    perWeek[w]=(perWeek[w]||0)+1;
    const du=getDur(d,w);
    if(du){ timeTotal+=du; timeCount++; timeWeek[w]=(timeWeek[w]||0)+du; }
  }));
  const timeAvg = timeCount>0 ? Math.round(timeTotal/timeCount) : 0;
  let cur=0; for(let i=0;i<nd;i++) if(isDone(i,week))cur++;
  let rows='';
  for(let w=1;w<=DATA.weeks;w++){
    const c=perWeek[w]||0, dl=DATA.deload.includes(w), tw=timeWeek[w]||0;
    rows+=`<div class="srow${dl?' dl':''}"><span>Semana ${w}${dl?' · deload':''}${tw?' · ⏱ '+fmtDur(tw):''}</span><b>${c>=nd?'✓ ':''}${c}/${nd}</b><div class="sbar"><i style="width:${Math.round(c/nd*100)}%"></i></div></div>`;
  }
  document.getElementById('summaryBody').innerHTML=`
    <div class="scards">
      <div class="scard"><div class="n">${cur}/${nd}</div><div class="l">Semana ${week} (atual)</div></div>
      <div class="scard"><div class="n">${last7}</div><div class="l">Últimos 7 dias</div></div>
      <div class="scard"><div class="n">${month}</div><div class="l">Este mês</div></div>
      <div class="scard"><div class="n">${total}</div><div class="l">Total no ciclo</div></div>
      <div class="scard"><div class="n">${fmtDur(timeTotal)}</div><div class="l">⏱ Tempo total</div></div>
      <div class="scard"><div class="n">${fmtDur(timeAvg)}</div><div class="l">⏱ Média por treino</div></div>
    </div>
    <div class="sbreak">Treinos por semana do plano</div>
    ${rows}
    <div class="sbreak2">Backup dos dados</div>
    <div class="backup">
      <button onclick="exportBackup()">⬇ Exportar backup</button>
      <button onclick="document.getElementById('importFile').click()">⬆ Importar backup</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importBackup(this)">
    <div class="backup-note">Ciclo 2. Os dados do ciclo 1 continuam salvos neste aparelho, intactos, em outra chave. Seus dados ficam <b>só neste aparelho</b>. Exporte um backup de vez em quando (o arquivo vai para os Downloads) para nunca perder cargas e histórico. Para importar, escolha o arquivo salvo.</div>`;
  document.getElementById('summary').style.display='flex';
}
function closeSummary(){ document.getElementById('summary').style.display='none'; }
function exportBackup(){
  const payload={ app:STORE, exportedAt:new Date().toISOString(), state:state };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  a.href=url; a.download=STORE+'_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackup(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      const incoming=o&&o.state?o.state:o;
      if(!incoming||typeof incoming!=='object') throw 0;
      if(!confirm('Importar este backup? Os dados atuais deste aparelho serão substituídos.')) { input.value=''; return; }
      state=incoming;
      day=state.day??0; week=state.week??1;
      localStorage.setItem(STORE, JSON.stringify(state));
      renderAll();
      alert('Backup importado com sucesso ✓');
    }catch(e){ alert('Arquivo inválido. Escolha um backup exportado por este app.'); }
    input.value='';
  };
  r.readAsText(f);
}
function setCell(d,w,i,k,v){
  state.data=state.data||{}; state.data[d]=state.data[d]||{}; state.data[d][w]=state.data[d][w]||{};
  state.data[d][w][i]=state.data[d][w][i]||{}; state.data[d][w][i][k]=v; save();
}

function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  DATA.days.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===day?' active':''); b.innerHTML='D'+(i+1)+' · '+(d.short||'')+(isDone(i,week)?' <span class="tk">✓</span>':'');
    b.onclick=()=>{day=i;save();renderAll();window.scrollTo(0,0)}; t.appendChild(b);
  });
}
function weekCount(w){
  const nd=DATA.days.length; let c=0;
  for(let d=0;d<nd;d++) if(isDone(d,w))c++;
  return c;
}
function renderWeeks(){
  const w=document.getElementById('weekbar'); w.innerHTML='';
  const nd=DATA.days.length;
  for(let i=1;i<=DATA.weeks;i++){
    const dl=DATA.deload.includes(i);
    const c=weekCount(i), full=c>=nd;
    const b=document.createElement('button');
    b.className='wk'+(i===week?' active':'')+(dl?' deload':'')+(full?' full':'');
    const small = full ? '<small class="ok">✓</small>' : (dl?'<small>deload</small>':(c>0?'<small>'+c+'/'+nd+'</small>':'<small>&nbsp;</small>'));
    const bar = (!full&&c>0) ? '<span class="fillbar"><i style="width:'+Math.round(c/nd*100)+'%"></i></span>' : (full?'<span class="fillbar"><i style="width:100%"></i></span>':'');
    b.innerHTML=i+small+bar;
    b.onclick=()=>{week=i;save();renderAll()}; w.appendChild(b);
  }
}
function effEx(ex,w){
  if(ex.alt && w>=ex.alt.from){ var o=Object.assign({},ex); for(var k in ex.alt){ if(k!=='from'&&ex.alt[k]!=null) o[k]=ex.alt[k]; } o.varB=true; return o; }
  return ex;
}
function altFloor(ex,w){ return (ex.alt && w>=ex.alt.from) ? ex.alt.from : 1; }
function renderList(){
  const d=DATA.days[day];
  document.getElementById('dayName').textContent=d.title;
  const rb=document.getElementById('runBar');
  if(d.run){ rb.style.display='flex'; rb.className='runbar'+(d.runKey?' key':'');
    rb.innerHTML='<span class="ico">\u{1F3C3}</span><span>'+d.run+'</span>'; }
  else { rb.style.display='none'; }
  document.getElementById('deloadNote').style.display=DATA.deload.includes(week)?'block':'none';
  const list=document.getElementById('list'); list.innerHTML='';
  d.exercises.forEach((ex0,i)=>{
    const ex=effEx(ex0,week);
    const pend = ex.from && week < ex.from;
    const prevBi=i>0?d.exercises[i-1].biset:null;
    const cont=ex.biset && ex.biset===prevBi;
    const c=cell(day,week,i);
    const exdone=isExDone(day,week,i);
    const card=document.createElement('div');
    card.className='card'+(ex.biset?' biset'+(cont?' cont':''):'')+(exdone?' exdone':'')
      +(ex.tag==='REAB'&&!ex.biset?' reab':'')+(ex.tag==='CUIDADO'&&!ex.biset?' cuidado':'')+(pend?' pendente':'');
    if(ex.biset) card.dataset.bi=ex.biset;
    const showTag = ex.biset && !cont;
    // rest control: only if there is real rest
    const restHtml = ex.restSec>0
      ? `<button class="rest-btn" onclick="startTimer(${ex.restSec}, ${JSON.stringify(ex.name).replace(/"/g,'&quot;')})"><span class="t">⏱ ${ex.restSec}s</span><span class="l">descanso</span></button>`
      : `<button class="rest-btn" style="opacity:.5" onclick="startTimer(30,'Emenda bi-set')"><span class="t">→</span><span class="l">emenda</span></button>`;
    const nextBi = (i+1<d.exercises.length)?d.exercises[i+1].biset:null;
    const linkHtml = (ex.biset && ex.biset===nextBi)
      ? `<div class="biset-link">↳ bi-set: emenda direto no próximo (<b>sem descanso</b>)</div>` : '';
    const last=lastFilled(day,week,i,altFloor(ex0,week));
    const lastHtml = week>1 ? (last
      ? `<div class="lastweek"><span class="tagw">SEM ${last.w}</span><span class="vals">Semana passada: <b>${last.carga||'—'} kg</b> · <b>${last.reps||'—'} reps</b></span></div>`
      : `<div class="lastweek empty"><span class="tagw">—</span><span class="vals">Sem registro anterior</span></div>`)
      : '';
    card.innerHTML = `
      <button class="excheck${exdone?' on':''}" data-i="${i}" onclick="toggleEx(${i})" aria-label="Marcar exercício">${exdone?'✓':''}</button>
      ${showTag?`<span class="biset-tag ${ex.biset}">BI-SET ${ex.biset}</span>`:''}
      ${ex.tag?`<span class="tagex ${ex.tag}">${ex.tag}</span>`:''}
      ${ex.varB?'<span class="tagex VAR">VARIAÇÃO B</span>':''}
      <div class="ex-name">${ex.name}</div>
      <div class="ex-meta">
        <span class="chip sets">${ex.sets}</span>
        <span class="chip muscle">${ex.muscle}</span>
        <span class="chip">⏱ ${ex.rest}</span>
      </div>
      ${pend?`<div class="pendnote">Ainda não. Este exercício entra na semana ${ex.from} — antes disso o tendão não está pronto.</div>`:''}
      ${ex.note?`<div class="note">${ex.note}</div>`:''}
      ${ex.ref?`<div class="ref"><span class="tagr">CICLO 1</span><span class="v">${ex.ref}</span></div>`:''}
      ${lastHtml}
      <div class="inputs">
        <div class="field">
          <label>Carga (kg)</label>
          <input inputmode="decimal" placeholder="${last&&last.carga?last.carga:'—'}" value="${c.carga??''}"
            oninput="onInput(${i},'carga',this)" class="${c.carga?'filled':''}">
        </div>
        <div class="field">
          <label>Reps feitas</label>
          <input inputmode="numeric" placeholder="${last&&last.reps?last.reps:'—'}" value="${c.reps??''}"
            oninput="onInput(${i},'reps',this)" class="${c.reps?'filled':''}">
        </div>
        ${restHtml}
      </div>
      ${linkHtml}
    `;
    list.appendChild(card);
  });
}
function onInput(i,k,el){
  setCell(day,week,i,k,el.value);
  el.classList.toggle('filled', !!el.value);
}
function renderAll(){ renderTabs(); renderWeeks(); renderList(); renderDoneBtn(); renderSess(); }

/* ---------- Rest timer ---------- */
let total=60,left=60,tick=null,paused=false,alerted=false,endAt=0;
const tEl=document.getElementById('timer');
function fmt(s){s=Math.abs(s);const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function draw(){
  const t=document.getElementById('tTime');
  t.textContent=(left<0?'−':'')+fmt(left);
  const pct=total>0?Math.max(0,Math.min(100,left/total*100)):0;
  const fill=document.getElementById('tFill'); fill.style.width=pct+'%';
  const low=left<=10;
  fill.classList.toggle('low',low);
  t.classList.toggle('low',low);
}
function startTimer(sec,label){
  total=sec;left=sec;paused=false;alerted=false;
  tEl.dataset.label=label||'Descanso';
  document.getElementById('tLabel').textContent=label||'Descanso';
  document.getElementById('tPause').textContent='Pausar';
  tEl.classList.remove('done'); tEl.classList.add('show');
  endAt=Date.now()+sec*1000;
  draw(); clearInterval(tick);
  tick=setInterval(()=>{
    if(paused){endAt+=250;return}
    left=Math.round((endAt-Date.now())/1000);
    draw();
    if(left<=0 && !alerted){ alerted=true; alarm(); }
  },250);
  if(navigator.vibrate)navigator.vibrate(20);
}
function alarm(){
  tEl.classList.add('done');
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,300]);
  beep();
  document.getElementById('tLabel').textContent='⚠ Passou do descanso';
  setTimeout(()=>tEl.classList.remove('done'),1600);
}
function togglePause(){ paused=!paused; document.getElementById('tPause').textContent=paused?'Continuar':'Pausar'; }
function adjust(d){ endAt+=d*1000; left=Math.round((endAt-Date.now())/1000); if(total>0)total=Math.max(total,left); draw(); }
function stopTimer(){ clearInterval(tick); tEl.classList.remove('show','done'); }
let actx;
function beep(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    [0,0.18,0.36].forEach(t=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=880;
      o.connect(g);g.connect(actx.destination);
      const s=actx.currentTime+t;
      g.gain.setValueAtTime(0.001,s);
      g.gain.exponentialRampToValueAtTime(0.4,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,s+0.15);
      o.start(s);o.stop(s+0.16);
    });
  }catch(e){}
}
// unlock audio on first touch
document.addEventListener('touchstart',()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{once:true});

renderAll();
</script>
